# RTM Ci_01, Ci_02, Gates_01
# The gates, as a contributor runs them: `cmake --workflow --preset gates`
# configures (running the generator), builds, and runs in order the linter,
# the generator check, the tests and the document render. CI adds only the
# toolchains and uploads the rendered HTML and PDF for review.
# Runs per development/ci_runners.md: on pull requests that are not drafts
# and by hand, never on a push; a new commit cancels its pull request's run;
# Markdown-only changes run nothing.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: lint, generator check, tests, document
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    # Blacksmith's Ubuntu 24.04 x64 runner, 2 vCPU / 8 GB (labels read
    # 2026-11-24 from https://docs.blacksmith.sh/blacksmith-runners/overview).
    # Every CI job in this organisation runs on Blacksmith (decided 2026-11-24).
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv installs the pinned Python and the locked mypy and pytest; its cache
      # is keyed by uv.lock.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.12"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Ruby and the Gemfile.lock's Asciidoctor and Asciidoctor PDF, cached by
      # the lockfile.
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      # Catch2 is fetched into dependencies/ at configure, pinned by archive
      # hash in tests/CMakeLists.txt, so that file's hash is the cache key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dependencies
          key: dependencies-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}
          restore-keys: dependencies-${{ runner.os }}-
      - run: uv sync --locked
      - run: cmake --workflow --preset gates
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: i2s-specification
          path: build/release/doc/
          if-no-files-found: error
